<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗾 不動産エリア特性マップ | AI-Driven Market Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-glass: rgba(15, 23, 42, 0.85);
  --border: rgba(255,255,255,0.08);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --accent-blue: #3b82f6;
  --accent-green: #10b981;
}

body {
  font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', Meiryo, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== HEADER ========== */
#app-header {
  height: 56px;
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
#header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
#header-logo {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
#header-sub {
  font-size: 0.65rem;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  font-weight: 500;
}
#header-right {
  display: flex;
  gap: 8px;
}
.header-btn {
  padding: 6px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}
.header-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}

/* ========== 3-COLUMN LAYOUT ========== */
#main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ========== LEFT SIDEBAR ========== */
#left-sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-section-title {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* Search */
#search-input {
  width: 100%;
  padding: 9px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s;
}
#search-input:focus {
  border-color: var(--accent-blue);
  background: rgba(59,130,246,0.05);
}
#search-input::placeholder {
  color: #4b5563;
}
#search-suggestions {
  display: none;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 6px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.suggestion-item {
  padding: 9px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: rgba(255,255,255,0.05); }
.sug-city { font-size: 0.82rem; color: var(--text-primary); font-weight: 600; flex: 1; }
.sug-pref { font-size: 0.68rem; color: var(--text-secondary); }
.sug-badge {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}
.sug-badge.r5 { background: rgba(179,217,247,0.2); color: #b3d9f7; }
.sug-badge.r4 { background: rgba(179,240,179,0.2); color: #b3f0b3; }
.sug-badge.r3 { background: rgba(255,244,176,0.2); color: #fff4b0; }
.sug-badge.r2 { background: rgba(255,217,168,0.2); color: #ffd9a8; }
.sug-badge.r1 { background: rgba(255,179,179,0.2); color: #ffb3b3; }

/* Legend */
.leg-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 0.75rem;
}
.leg-item:hover { background: rgba(255,255,255,0.04); }
.leg-item.dim { opacity: 0.3; }
.leg-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}
.leg-label { color: var(--text-primary); font-size: 0.73rem; }
.leg-sub { color: var(--text-secondary); font-size: 0.63rem; margin-left: auto; }

/* Map Controls */
.map-ctrl-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
  width: 100%;
}
.ctrl-btn {
  flex: 1;
  height: 32px;
  padding: 0;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  line-height: 32px;
}
.ctrl-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}
#zoom-ratio-display {
  padding: 6px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 0.73rem;
  text-align: center;
  flex: 1;
}

/* ========== MAP AREA ========== */
#map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #0b1628;
  touch-action: none;
}
#map {
  width: 100%;
  height: 100%;
  display: block;
  will-change: transform;
}
#map path {
  shape-rendering: optimizeSpeed;
  vector-effect: non-scaling-stroke;
}

/* Map toggle button */
#pref-border-toggle {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 7px 14px;
  background: rgba(15,23,42,0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 0.73rem;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s;
}
#pref-border-toggle:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}
#pref-border-toggle.active {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

/* 右下フローティング凡例 */
#legend-panel {
  position: absolute;
  bottom: 36px;
  right: 16px;
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 12px;
  backdrop-filter: blur(8px);
  z-index: 10;
  min-width: 160px;
}
#legend-title {
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* Map path colors */
path.pref, path.muni {
  vector-effect: non-scaling-stroke;
  cursor: pointer;
}
path.pref {
  stroke: rgba(255,255,255,0.25);
  stroke-width: 0.8px;
}
path.muni {
  stroke: rgba(180,180,180,0.45);
  stroke-width: 0.6px;
}
path.pref.r5, path.muni.r5 { fill: #b3d9f7; }
path.pref.r4, path.muni.r4 { fill: #b3f0b3; }
path.pref.r3, path.muni.r3 { fill: #fff4b0; }
path.pref.r2, path.muni.r2 { fill: #ffd9a8; }
path.pref.r1, path.muni.r1 { fill: #ffb3b3; }
path.pref.r0, path.muni.r0 { fill: #64748b; }

/* ホバー効果はマウス操作のみ（タッチデバイスでは無効） */
@media (hover: hover) {
  path.pref, path.muni {
    transition: filter 0.15s;
  }
  path.pref:hover, path.muni:hover {
    filter: brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,0.4));
    stroke: rgba(255,255,255,0.6);
    stroke-width: 1px;
  }
}
path.pref.active {
  stroke: #3b82f6;
  stroke-width: 2px;
}
path.muni.selected-muni {
  stroke: #3b82f6;
  stroke-width: 2px;
}

text.pref-label {
  pointer-events: none;
  user-select: none;
}

/* ========== RIGHT SIDEBAR ========== */
#right-sidebar {
  width: 360px;
  flex-shrink: 0;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: none;
  flex-direction: column;
  overflow: hidden;
}
#right-sidebar.panel-open {
  display: flex;
  animation: slideInRight 0.3s ease-out;
}
@keyframes slideInRight {
  from { transform: translateX(40px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}
#panel-placeholder { display: none; }

#panel-content {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* Panel Header */
#panel-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
#panel-pref-name {
  font-size: 0.68rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
#panel-city-name {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}
#panel-close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px;
  height: 28px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
#panel-close-btn:hover {
  background: rgba(255,255,255,0.12);
  color: var(--text-primary);
}

/* Panel Body */
#panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
}
#panel-body::-webkit-scrollbar { width: 4px; }
#panel-body::-webkit-scrollbar-track { background: transparent; }
#panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* Panel Cards */
.panel-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
}
.panel-card-title {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Rating Section */
#rating-stars {
  font-size: 1.4rem;
  color: #fbbf24;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
#rating-score {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.rank-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
}
.rank-ss { background: rgba(179,217,247,0.2); color: #b3d9f7; border: 1px solid rgba(179,217,247,0.3); }
.rank-a { background: rgba(179,240,179,0.2); color: #b3f0b3; border: 1px solid rgba(179,240,179,0.3); }
.rank-b { background: rgba(255,244,176,0.2); color: #fff4b0; border: 1px solid rgba(255,244,176,0.3); }
.rank-c { background: rgba(255,217,168,0.2); color: #ffd9a8; border: 1px solid rgba(255,217,168,0.3); }
.rank-d { background: rgba(255,179,179,0.2); color: #ffb3b3; border: 1px solid rgba(255,179,179,0.3); }

/* Data rows */
.data-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.75rem;
  line-height: 1.4;
  gap: 8px;
}
.data-row:last-child { border-bottom: none; padding-bottom: 0; }
.data-label {
  color: var(--text-secondary);
  flex-shrink: 0;
  font-size: 0.72rem;
}
.data-val {
  color: var(--text-primary);
  flex: 1;
  text-align: right;
}
/* 数値データ専用（右揃え、強調） */
.data-val-num {
  color: #f1f5f9;
  font-size: 0.88rem;
  font-weight: 600;
  text-align: right;
  letter-spacing: 0.02em;
}
.data-unit {
  color: var(--text-secondary);
  font-size: 0.68rem;
  margin-left: 3px;
  font-weight: 400;
}
.data-badge-up   { color: #10b981; font-weight: 700; font-size: 0.8rem; }
.data-badge-down { color: #f87171; font-weight: 700; font-size: 0.8rem; }
.data-badge-flat { color: #94a3b8; font-weight: 700; font-size: 0.8rem; }

/* Strengths / Risks */
.eval-list {
  list-style: none;
  padding: 0;
}
.eval-list li {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-primary);
  padding: 3px 0;
  line-height: 1.4;
}
.eval-list li::before {
  content: '•';
  color: var(--accent-green);
  font-weight: 700;
  flex-shrink: 0;
}
.eval-list.risks li::before {
  color: #f87171;
}

/* AI Comment */
.ai-comment {
  font-size: 0.75rem;
  color: #f1f5f9;
  line-height: 1.7;
  border-left: 3px solid var(--accent-blue);
  padding-left: 10px;
}

/* Tooltip */
#tip {
  display: none;
  position: fixed;
  z-index: 9000;
  background: rgba(15,23,42,0.97);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: 240px;
  min-width: 180px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  pointer-events: none;
}
#tip-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.tip-rating-badge {
  font-size: 0.75rem;
}
#tip-info {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.tip-detail-row {
  display: flex;
  gap: 8px;
  font-size: 0.72rem;
  margin-bottom: 4px;
  line-height: 1.4;
}
.tip-detail-label {
  color: #64748b;
  width: 80px;
  flex-shrink: 0;
}
.tip-detail-val {
  color: #cbd5e1;
  flex: 1;
}
.tip-rec-box {
  margin-top: 8px;
  padding: 8px;
  background: rgba(59,130,246,0.08);
  border-radius: 6px;
  font-size: 0.7rem;
  color: #93c5fd;
  line-height: 1.5;
  border: 1px solid rgba(59,130,246,0.15);
}

/* Loading & Error badges */
#loading-badge {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.95);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  z-index: 9000;
  backdrop-filter: blur(8px);
}
#offline-error-console {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  max-width: 340px;
  background: rgba(30,10,10,0.95);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 0.72rem;
  color: #f87171;
  z-index: 9000;
}

/* Zoom info */
#zoom-info {
  font-size: 0.68rem;
  color: var(--text-secondary);
  margin-top: 6px;
  text-align: center;
}

/* Scrollbar for left sidebar */
#left-sidebar { overflow-y: auto; }
#left-sidebar::-webkit-scrollbar { width: 4px; }
#left-sidebar::-webkit-scrollbar-track { background: transparent; }
#left-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); }

/* ========== MOBILE RESPONSIVE ========== */
@media (max-width: 768px) {
  header {
    height: 44px;
    padding: 0 10px;
  }
  #header-logo { font-size: 0.82rem; }
  #header-sub { display: none; }

  /* メインレイアウト: 縦積み */
  #main-layout { flex-direction: column; }

  /* 左サイドバー: 縦積み・全幅 */
  #left-sidebar {
    width: 100%;
    height: auto;
    flex-direction: column;
    overflow: visible;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    gap: 0;
    flex-shrink: 0;
    position: relative;
  }

  .sidebar-section {
    width: 100%;
    padding: 0;
    border: none;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-section-title {
    display: block;
    font-size: 0.6rem;
    margin-bottom: 2px;
    line-height: 1;
  }

  /* エリア検索: 全幅・font-size:16px必須（iOS自動ズーム防止） */
  #search-input {
    width: 100%;
    font-size: 16px;
    padding: 8px 12px;
    box-sizing: border-box;
  }
  /* 検索ラッパー: 候補リストの基準点 */
  #search-wrapper {
    position: relative;
    width: 100%;
  }
  /* 候補リスト: 検索ボックスの真下に表示 */
  #search-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    width: auto;
    z-index: 300;
    margin-top: 4px;
  }

  /* 地図操作セクション: 非表示 */
  #left-sidebar .sidebar-section:last-child { display: none; }

  /* 地図エリア: 最大化 */
  #map-wrap {
    flex: 1;
    min-height: 0;
  }

  /* モバイル: 凡例はデスクトップと同じ右下枠スタイル・少し小さめ */
  /* iOSブラウザの下バー(safe-area)を考慮して上に避ける */
  #legend-panel {
    bottom: calc(140px + env(safe-area-inset-bottom, 0px));
    right: 10px;
    padding: 8px 10px;
    min-width: 140px;
  }
  #legend-title { font-size: 0.58rem; margin-bottom: 6px; }
  .leg-dot { width: 9px; height: 9px; }
  .leg-label { font-size: 0.62rem; }

  /* 右パネル: 下部固定ドロワー（地図に重ねる） */
  #right-sidebar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100% !important;
    height: 48vh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    z-index: 200;
    overflow-y: auto;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
  }
  #right-sidebar.panel-open {
    animation: slideUpMobile 0.3s ease-out;
  }
  @keyframes slideUpMobile {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  #panel-header { padding: 8px 12px 6px; }
  #panel-city-name { font-size: 1.05rem; }
  #panel-pref-name { font-size: 0.6rem; }
  #panel-body { padding: 8px 12px; }
  .panel-card { padding: 8px; margin-bottom: 6px; }
  .data-row { font-size: 0.7rem; padding: 3px 0; }
  .data-val-num { font-size: 0.75rem; }
  .score-details { font-size: 0.65rem; }

  /* フローティングウィンドウ */
  #tip { max-width: 88vw; font-size: 0.68rem; }
}

@media (max-width: 480px) {
  header { height: 40px; }
  #header-logo { font-size: 0.75rem; }
  #right-sidebar { height: 52vh; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="app-header">
  <div id="header-left">
    <div id="header-logo">🗾 不動産エリア特性マップ</div>
    <div id="header-sub">AI-DRIVEN MARKET INTELLIGENCE PLATFORM</div>
  </div>
  <div id="header-right">

  </div>
</header>

<!-- MAIN LAYOUT -->
<div id="main-layout">

  <!-- LEFT SIDEBAR -->
  <aside id="left-sidebar">
    <!-- エリア検索 -->
    <div class="sidebar-section">

/* --- 市区町村名の正規化関数 (超強化版) --- */
/* --- 市区町村名の正規化関数 (超強化版) --- */
function normalizeMunicipalityName(name) {
  if (!name) return "";
  let s = String(name);
  
  // カッコとその中身を除去 (例: "浜松市（中央区" -> "浜松市")
  s = s.replace(/[\(（].*?[\)）]/g, "");
  s = s.replace(/[（）()]/g, "");
  
  // 全角英数字・記号・スペースを半角に
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(m) {
    return String.fromCharCode(m.charCodeAt(0) - 0xFEE0);
  });
  s = s.replace(/　/g, " ");
  // 空白や改行を除去
  s = s.replace(/[\s\r\n\t]/g, "");
  
  // 表記揺れの統一
  s = s.replace(/[ヶケが]/g, "ヶ");
  s = s.replace(/之/g, "の");
  s = s.replace(/[-－‐—ー]/g, "-");
  
  // 郡名（例：紫波郡、大泉町など）の除去
  s = s.replace(/^.*郡/, "");
  
  // 末尾の「市」「区」「町」「村」をカット
  // 1文字の市区町村名（津市、堺市、北区など）が消えてしまうのを防ぐため、2文字以上の場合のみカット
  if (s.length >= 2) {
    s = s.replace(/[市区町村]$/, "");
  }
  
  return s;
}

/* --- 動的初期化処理 (AREA_DATAより辞書と最大評価を動的生成) --- */
const AVG_RATINGS = {};

function initializeData() {
  console.log("[init] Initializing dynamic rating dictionaries...");

  for (const [pref, areas] of Object.entries(AREA_DATA)) {
    let maxR = 0;
    let sum = 0, count = 0;
    areas.forEach(a => {
      if (a.rating) {
        if (a.rating > maxR) maxR = a.rating;
        sum += a.rating;
        count++;
      }
    });
    const avgR = count > 0 ? Math.round(sum / count) : 0;
    // 短縮名（PREF_SHORTのキーは都道府県フルネーム）でも格納してrenderMapのlookupに対応
    const shortPref = PREF_SHORT[pref] || pref;
    MAX_RATINGS[pref]  = maxR;  MAX_RATINGS[shortPref]  = maxR;
    AVG_RATINGS[pref]  = avgR;  AVG_RATINGS[shortPref]  = avgR;
  }
  
  for (const [pref, areas] of Object.entries(AREA_DATA)) {
    const shortPref = pref.endsWith("県") || pref.endsWith("都") || pref.endsWith("府") ? pref.slice(0, -1) : pref;
    
    areas.forEach(area => {
      const rating = area.rating;
      const cities = area.cities || [];
      
      cities.forEach(city => {
        const normCity = normalizeMunicipalityName(city);
        if (!normCity) return;
        
        const compositeKey = `${shortPref}_${normCity}`;
        
        if (MUNI_RATING_DICT[compositeKey]) {
          const prev = MUNI_RATING_DICT[compositeKey];
          DUPLICATE_MUNI_REPORT.push({
            "municipality名": city,
            "prefecture": pref,
            "出現回数": 2,
            "rating一覧": `${prev.rating} (行:${prev.excelRow}), ${rating} (行:${area.excelRow})`,
            "最終採用値": Math.max(prev.rating || 0, rating || 0)
          });
          
          if ((rating || 0) > (prev.rating || 0)) {
            MUNI_RATING_DICT[compositeKey] = {
              rating: rating,
              areaType: area.name,
              excelRow: area.excelRow,
              originalName: city,
              population: area.population,
              vacancy: area.vacancy,
              landRisk: area.landRisk,
              recommendation: area.recommendation
            };
          }
        } else {
          MUNI_RATING_DICT[compositeKey] = {
            rating: rating,
            areaType: area.name,
            excelRow: area.excelRow,
            originalName: city,
            population: area.population,
            vacancy: area.vacancy,
            landRisk: area.landRisk,
            recommendation: area.recommendation
          };
        }
      });
    });
  }
  
  if (DUPLICATE_MUNI_REPORT.length > 0) {
    console.log("=== 重複municipalityレポート ===");
    console.table(DUPLICATE_MUNI_REPORT);
  }
}

/* --- デバッグユーティリティ (window.DEBUG = true で有効) --- */
const _debug = {
  startTime: null,

};

/* --- 市区町村の評価ランクを取得 (geoBoundaries用・空間検索 + 複合キー辞書による精密判定 + ローマ字自動解決 + 5段階優先補完) --- */
function getMuniRatingGB(shapeName, lon, lat) {
  let matchedPrefName = null;
  for (const pref of prefFeatures) {
    try {
      if (d3.geoContains(pref, [lon, lat])) {
        matchedPrefName = PREF_SHORT[pref.properties.nam_ja] || pref.properties.nam_ja;
        if (matchedPrefName !== "京都" && matchedPrefName !== "東京都") {
          matchedPrefName = matchedPrefName.endsWith("県") || matchedPrefName.endsWith("都") || matchedPrefName.endsWith("府") ? matchedPrefName.slice(0, -1) : matchedPrefName;
        }
        break;
      }
    } catch(e) {}
  }
  
  if (!matchedPrefName) {
    return { rating: null, pref: "不明", jaName: "不明", compositeKey: "不明", excelRow: null, status: "PREF_NOT_FOUND", confidence: "unmatched", reason: "都道府県判定失敗" };
  }

  // --- 空間近傍探索（フォールバック） ---
  const fullPref = PREF_FULL[matchedPrefName] || matchedPrefName;
  const areas = AREA_DATA[fullPref] || AREA_DATA[matchedPrefName] || [];
  
  let bestArea = null;
  let bestCity = null;
  let minD = Infinity;
  
  areas.forEach(area => {
    if (area.lng && area.lat) {
      const d = Math.pow(area.lng - lon, 2) + Math.pow(area.lat - lat, 2);
      if (d < minD) {
        minD = d;
        bestArea = area;
        bestCity = area.cities ? area.cities[0] : "";
      }
    }
  });
  
  // 同一都道府県内で、距離が0.6度(約60km)以内の最も近い自治体へ自動マッピング
  if (bestArea && minD < 0.6) {
    const cleanJaName = bestCity;
    const normCity = normalizeMunicipalityName(cleanJaName);
    const compositeKey = `${matchedPrefName}_${normCity}`;
    
    return {
      rating: bestArea.rating,
      pref: matchedPrefName,
      jaName: cleanJaName,
      compositeKey: compositeKey,
      excelRow: bestArea.excelRow,
      status: "MATCHED",
      confidence: "spatial",
      reason: `空間近傍一致 (距離:${Math.sqrt(minD).toFixed(3)}度, 行:${bestArea.excelRow})`
    };
  }
  
  return {
    rating: null,
    pref: matchedPrefName,
    jaName: shapeName,
    compositeKey: "不明",
    excelRow: null,
    status: "UNMATCHED",
    confidence: "unmatched",
    reason: "近接に該当自治体なし (空間不一致)"
  };
}

async function loadMunicipalities() {
  if (muniFeatures) { renderAllMuni(); return; }
  if (muniLoading) return;
  muniLoading = true;

  const badge = document.getElementById('loading-badge');
  badge.textContent = '⏳ 市区町村データ展開中...';
  badge.style.display = 'block';

  try {
    if (!prefFeatures || !prefFeatures.length) {
      throw new Error('Prefecture features missing — renderMap() must complete first');
    }

    // 外部スクリプトから並列ロード（file://・GitHub Pages両対応）
    await Promise.all([
      _loadScript('muni_topo.js'),
      _loadScript('centroid.js')
    ]);
    muniTopoData = window.JAPAN_MUNI_TOPOJSON;

    // データ検証
    const objKey = Object.keys(muniTopoData.objects || {})[0];
    if (!objKey) throw new Error('Municipality TopoJSON: objects が空です');
    const rawCheck = topojson.feature(muniTopoData, muniTopoData.objects[objKey]).features;
    if (!rawCheck || !rawCheck.length) throw new Error('Municipality features missing');
    _debug.log(`TopoJSON検証OK: ${rawCheck.length}件のFeature`);
    let geomMissing = 0, codeMissing = 0;
    rawCheck.forEach(f => {
      if (!f.geometry) geomMissing++;
      if (!f.properties || !f.properties.shapeName) codeMissing++;
    });
    if (geomMissing) _debug.log(`geometry欠損: ${geomMissing}件`);
    if (codeMissing) _debug.log(`shapeName欠損: ${codeMissing}件`);

    // objKey / raw は上の検証ブロックで取得済み
    const raw = rawCheck;

    JOIN_LOGS.length = 0;
    UNMATCHED_MUNI_REPORT.length = 0;

    // 頂点座標の算術平均で重心を計算（PythonとJSで一致）
    function _simpleCentroid(geom) {
      if (!geom) return [0, 0];
      const lons = [], lats = [];
      function collect(c) {
        if (typeof c[0] === 'number') { lons.push(c[0]); lats.push(c[1]); }
        else c.forEach(collect);
      }
      collect(geom.coordinates);
      if (!lons.length) return [0, 0];
      return [lons.reduce((a,b)=>a+b)/lons.length, lats.reduce((a,b)=>a+b)/lats.length];
    }

    // 都市名 → フルエリアオブジェクト（population_num等含む）グローバルに格納
    _cityLookup = {};
    for (const [pd, areas] of Object.entries(AREA_DATA)) {
      const shortPd = PREF_SHORT[pd] || pd.replace(/[県都府]$/, '');
      for (const area of areas) {
        for (const city of (area.cities || [])) {
          _cityLookup[city] = Object.assign({}, area, { pref: shortPd, fullPref: pd });
        }
      }
    }

    muniFeatures = raw.map((f, featureIndex) => {
      const name = f.properties.shapeName || '';
      let rating = null;
      let prefName = "不明";
      let jaName = name;
      let compositeKey = "不明";
      let excelRow = null;
      let matchStatus = "UNMATCHED";
      let confidence = "unmatched";
      let reason = "完全不一致";

      try {
        // 重心座標キーで CENTROID_TO_CITY を参照
        const [lon, lat] = _simpleCentroid(f.geometry);

        // 英語shapeName → 日本語名の特例マッピング（重心ずれが生じるケース）
        const SHAPENAME_OVERRIDE = { 'Matsumae': '松前町_北海道' };
        const overrideJaName = SHAPENAME_OVERRIDE[name];

        const ckey = lon.toFixed(3) + '_' + lat.toFixed(3);
        const dictJaName = overrideJaName || (window._CENTROID_TO_CITY && window._CENTROID_TO_CITY[ckey]);

        if (dictJaName) {
          // AREA_DATA 直接ルックアップ（エクセル評価を確実に反映）
          const info = _cityLookup[dictJaName];
          if (info) {
            const normCity = normalizeMunicipalityName(dictJaName);
            rating    = info.rating;
            prefName  = info.pref;
            jaName    = dictJaName.replace(/_[^_]+$/, '');
            compositeKey = `${info.pref}_${normCity}`;
            excelRow  = info.excelRow;
            matchStatus = "MATCHED";
            confidence  = "centroid_dict";
            reason      = `重心辞書一致 ${ckey}→${dictJaName}`;
          } else {
            jaName = dictJaName;
            confidence = "dict_name_only";
            reason = `名前解決済みだがARÉA_DATA未登録 (${dictJaName})`;
          }
        } else {
          // フォールバック: 空間近傍探索
          const res = getMuniRatingGB(name, lon, lat);
          rating = res.rating;
          prefName = res.pref;
          jaName = res.jaName;
          compositeKey = res.compositeKey;
          excelRow = res.excelRow;
          matchStatus = res.status;
          confidence = res.confidence;
          reason = res.reason;
        }
      } catch(e) {
        rating = null;
      }
      
      const ratingClass = rating !== null ? `r${rating}` : 'r0';
      const logEntry = {
        "prefecture": prefName,
        "municipality": jaName,
        "正規化後キー": compositeKey,
        "GeoJSON側キー": name,
        "マッチ結果": matchStatus === "UNMATCHED" ? "失敗" : `成功 (${matchStatus})`,
        "最終rating": rating !== null ? rating : "null",
        "最終class名": ratingClass,
        "元Excel行番号": excelRow !== null ? excelRow : "なし",
        "confidence": confidence,
        "reason": reason
      };
      
      JOIN_LOGS.push(logEntry);
      
      if (matchStatus === "UNMATCHED") {
        console.warn(`[未一致警告] pref: ${prefName}, muni: ${jaName}, key: ${compositeKey}, GeoJSON_key: ${name} -> r0 (グレー表示)`);
        UNMATCHED_MUNI_REPORT.push(logEntry);
      }
      
      // _cityLookup はフルオブジェクト（population_num等含む）を保持
      let areaDetails = _cityLookup[jaName] || null;
      if (!areaDetails && excelRow && MUNI_RATING_DICT[compositeKey]) {
        areaDetails = MUNI_RATING_DICT[compositeKey];
      }
      return { 
        ...f, 
        _rating: rating !== null ? rating : 0, 
        _name: name, 
        _jaName: jaName,
        _confidence: confidence,
        _reason: reason,
        _details: areaDetails
      };
    });

    console.log(`[join] 総市区町村数: ${JOIN_LOGS.length}件 | マッチ成功: ${JOIN_LOGS.filter(l => !l.マッチ結果.includes("失敗")).length}件 | 未一致: ${UNMATCHED_MUNI_REPORT.length}件`);

    // --- 未評価自治体サイドバーアコーディオンの動的生成 ---
    const unmappedContainer = document.getElementById('unmapped-container');
    const unmappedCountEl = document.getElementById('unmapped-count');
    if (unmappedContainer) {
      unmappedContainer.innerHTML = '';
    
    const unmappedList = JOIN_LOGS.filter(l => l.confidence === "unmatched");
    unmappedCountEl.textContent = `${unmappedList.length}件`;
    
    const listWrapper = document.createElement('div');
    listWrapper.id = 'unmapped-list-wrapper';
    unmappedContainer.appendChild(listWrapper);
    
    function renderTabContent() {
      listWrapper.innerHTML = '';
      const prefGroups = {};
      unmappedList.forEach(item => {
        if (!prefGroups[item.prefecture]) prefGroups[item.prefecture] = [];
        prefGroups[item.prefecture].push(item);
      });
      
      const sortedPrefs = Object.keys(prefGroups).sort();
      if (sortedPrefs.length === 0) {
        listWrapper.innerHTML = `<div style="text-align:center;color:#64748b;font-size:0.68rem;padding:12px">未評価の市区町村はありません</div>`;
        return;
      }
      
      sortedPrefs.forEach(pref => {
        const groupEl = document.createElement('div');
        groupEl.className = 'unmapped-pref-group collapsed';
        
        const headerEl = document.createElement('div');
        headerEl.className = 'unmapped-pref-header';
        headerEl.textContent = `${pref} (${prefGroups[pref].length}件)`;
        headerEl.onclick = () => {
          groupEl.classList.toggle('collapsed');
        };
        
        const listEl = document.createElement('div');
        listEl.className = 'unmapped-city-list';
        
        prefGroups[pref].forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'unmapped-city-item';
          itemEl.innerHTML = `
            <span>${item.municipality} <span style="font-size:0.55rem;color:#4b5563">(行:${item.元Excel行番号})</span></span>
            <span class="unmapped-reason-badge" style="background:rgba(255,255,255,0.06);color:#6b7280" title="エクセルで評価が空欄です">未評価</span>
          `;
          
          itemEl.onclick = (e) => {
            e.stopPropagation();
            openPopup(item.prefecture, item.prefecture + "（未評価リストより逆引き）");
          };
          listEl.appendChild(itemEl);
        });
        
        groupEl.appendChild(headerEl);
        groupEl.appendChild(listEl);
        listWrapper.appendChild(groupEl);
      });
    }
    
    renderTabContent();
    } // End of unmappedContainer check

    badge.style.display = 'none';

    // デバッグ統計
    const matched = JOIN_LOGS.filter(l => !l.マッチ結果.includes('失敗')).length;
    _debug.stats.muniCount = JOIN_LOGS.length;
    _debug.stats.matchedCount = matched;
    _debug.stats.unmatchedCount = UNMATCHED_MUNI_REPORT.length;
    _debug.log(`市区町村数: ${JOIN_LOGS.length}, マッチ成功: ${matched}, 未一致: ${UNMATCHED_MUNI_REPORT.length}`);
    if (window.DEBUG) {
      console.table({
        市区町村数: JOIN_LOGS.length,
        マッピング成功: matched,
        マッピング失敗: UNMATCHED_MUNI_REPORT.length,
        描画自治体数: muniFeatures ? muniFeatures.length : 0
      });
    }

    renderAllMuni();
  } catch(e) {
    console.error('[muni] 取得失敗:', e.message);
    if (window.DEBUG) console.error('[DEBUG] エラー詳細:', e);
    badge.textContent = '⚠️ 市区町村データ取得失敗 — 都道府県表示中';
    badge.style.display = 'block';
    setTimeout(() => { badge.style.display = 'none'; }, 5000);
    prefGroup && prefGroup.style('opacity', 1);
    muniLoading = false;
  }
}

/* --- 市区町村レイヤを再描画 --- */
function renderAllMuni() {
  if (!muniGroup || !muniFeatures) return;
  muniGroup.selectAll('path.muni').remove();

  muniGroup.selectAll('path.muni')
    .data(muniFeatures)
    .enter()
    .append('path')
    .attr('class', d => `muni r${d._rating}`)
    .attr('d', pathFn)
    .on('mousemove', function(event, d) {
      const jaName = d._jaName || EN_TO_JA[d._name] || d._name;
      const r = d._rating;
      const info = _cityLookup[jaName];

      // 星色
      const starColor = r === 5 ? '#b3d9f7'   // ★5 青
                      : r === 4 ? '#b3f0b3'  // ★4 緑
                      : r === 3 ? '#fff4b0'  // ★3 黄
                      : r === 2 ? '#ffd9a8'  // ★2 橙
                      : r === 1 ? '#ffb3b3'  // ★1 赤
                      : '#64748b';           // 未評価

      // 基本データ行（数値）
      const rows = [];
      if (info?.population_num != null) rows.push(['人口', info.population_num.toLocaleString() + ' 人']);
      if (info?.households     != null) rows.push(['世帯数', info.households.toLocaleString() + ' 世帯']);
      if (info?.population_density != null) rows.push(['人口密度', Math.round(info.population_density).toLocaleString() + ' 人/km²']);
      if (info?.rental_housing_num != null) rows.push(['借家数', info.rental_housing_num.toLocaleString() + ' 戸']);
      if (info?.vacant_housing_num != null) rows.push(['借家の空室数', info.vacant_housing_num.toLocaleString() + ' 戸']);
      if (info?.vacant_rate != null) rows.push(['借家の空室率', (info.vacant_rate * 100).toFixed(2) + ' %']);

      const rowsHtml = rows.map(([label, val]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.72rem;">
          <span style="color:#f1f5f9">${label}</span>
          <span style="color:#f1f5f9;font-weight:600">${val}</span>
        </div>`).join('');

      tip.innerHTML = `
        <div style="font-size:0.9rem;font-weight:700;color:#f1f5f9;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span>${jaName}</span>
          ${r > 0 ? `<span style="color:${starColor};font-size:0.78rem;letter-spacing:1px">${STARS(r)}</span>` : ''}
        </div>
        ${rows.length > 0 ? `<div style="margin-top:4px">${rowsHtml}</div>` : `<div style="color:#64748b;font-size:0.72rem">統計データなし</div>`}
        <div style="margin-top:8px;font-size:0.65rem;color:#475569;text-align:right">クリックで詳細を表示</div>
      `;
      tip.style.display = 'block';

      const tw = 220;
      const th = tip.offsetHeight || 140;
      let left = event.clientX + 14;
      let top  = event.clientY - 12;
      if (left + tw > window.innerWidth)  left = event.clientX - tw - 14;
      if (top  + th > window.innerHeight) top  = window.innerHeight - th - 14;
      if (top < 0) top = 14;
      tip.style.left = left + 'px';
      tip.style.top  = top  + 'px';
    })
    .on('mouseleave', () => { tip.style.display = 'none'; })
    .on('click', function(event, d) {
      event.stopPropagation();
      tip.style.display = 'none';

      const jaName = d._jaName || EN_TO_JA[d._name] || d._name;

      // 選択ハイライト
      muniGroup.selectAll('path.muni').classed('selected-muni', false);
      d3.select(this).classed('selected-muni', true);

      // 都道府県名を取得
      let prefName = '';
      try {
        const [lon, lat] = d3.geoCentroid(d);
        for (const pref of prefFeatures) {
          if (d3.geoContains(pref, [lon, lat])) {
            prefName = pref.properties.nam_ja || '';
            break;
          }
        }
      } catch(e) {}

      // _cityLookup からフルオブジェクト（population_num等含む）を取得
      const areaDetails = _cityLookup[jaName] || d._details || null;

      openCityPanel(jaName, prefName, areaDetails);
    });

  applyFilter();
}

/* --- ズームUI更新 --- */
function updateZoomUI(k) {
  const levelEl = document.getElementById('zi-level-text');
  const hintEl = document.getElementById('zi-hint-text');
  if (!levelEl || !hintEl) return; // Safety Guard
  const isMuni = k >= MUNI_THRESHOLD;

/* --- メインマップ描画 --- */
function renderMap(japan){
  _debug.startTime = performance.now();
  const w = getW(), h = getH();
  projFn = makeProjection(w, h);
  pathFn = d3.geoPath().projection(projFn);

  svg.attr('viewBox', `0 0 ${w} ${h}`);
  svg.selectAll('*').remove();

  // ズームグループ
  mapGroup = svg.append('g').attr('id', 'map-group');
  prefGroup = mapGroup.append('g').attr('id', 'pref-group');
  muniGroup = mapGroup.append('g').attr('id', 'muni-group');
  labelGroup = mapGroup.append('g').attr('id', 'label-group');

  const features = topojson.feature(japan, japan.objects.japan).features;
  prefFeatures = features;

  // 都道府県パス
  prefGroup.selectAll('path.pref')
    .data(features)
    .enter()
    .append('path')
    .attr('class', d => {
      const shortName = PREF_SHORT[d.properties.nam_ja] || d.properties.nam_ja;
      const r = AVG_RATINGS[shortName] || AVG_RATINGS[d.properties.nam_ja] || 0;
      return `pref r${r}`;
    })
    .attr('d', pathFn)
    .attr('data-pref', d => PREF_SHORT[d.properties.nam_ja] || d.properties.nam_ja)
    .on('mousemove', function(event, d){
      const shortName = PREF_SHORT[d.properties.nam_ja] || d.properties.nam_ja;
      const fullName  = d.properties.nam_ja;
      const maxR = MAX_RATINGS[shortName] || MAX_RATINGS[fullName] || 0;
      const avgR = AVG_RATINGS[shortName] || AVG_RATINGS[fullName] || 0;
      const areas = AREA_DATA[fullName] || AREA_DATA[shortName] || [];

      let html = `<div id="tip-name"><span>${fullName}</span>`;
      if (avgR > 0) {
        html += `<span class="tip-rating-badge" style="color: #fff4b0;">平均: ${STARS(avgR)}</span>`;
      }
      html += `</div>`;

      if (avgR > 0) {
        html += `
          <div id="tip-info" style="margin-bottom: 0; color: #cbd5e1; font-size: 0.72rem;">
            収録市区町村数: <strong style="color: #93c5fd; font-size: 0.85rem;">${areas.length}</strong> 件
            &nbsp;｜&nbsp; 最高評価: <strong style="color: #fbbf24;">${STARS(maxR)}</strong>
          </div>
          <div style="font-size: 0.65rem; color: #64748b; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; line-height: 1.4;">
            🔍 ズームイン（2.5倍以上）で市区町村ごとの詳細評価が表示されます。
          </div>
        `;
      } else {
        html += `<div id="tip-info" style="color: #64748b;">データなし</div>`;
      }
      
      tip.innerHTML = html;
      tip.style.display = 'block';
      
      let left = event.clientX + 14;
      let top = event.clientY - 12;
      if (left + 280 > window.innerWidth) {
        left = event.clientX - 280 - 14;
      }
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    })
    .on('mouseleave', () => { tip.style.display = 'none'; })
    .on('click', function(event, d){
      event.stopPropagation();
      const shortName = PREF_SHORT[d.properties.nam_ja] || d.properties.nam_ja;
      if(AREA_DATA[shortName]){
        openPopup(shortName, d.properties.nam_ja);
        prefGroup.selectAll('path.pref').classed('active', false);
        d3.select(this).classed('active', true);
        selected = shortName;
      }
    });

  // 都道府県ラベル
  // MultiPolygon（東京・鹿児島・沖縄等）は最大ポリゴンの重心を使用
  function getLabelCentroid(d) {
    const geom = d.geometry;
    if (geom && geom.type === 'MultiPolygon') {
      let bestPoly = null, bestArea = -1;
      geom.coordinates.forEach(polyCoords => {
        const f = { type: 'Feature', geometry: { type: 'Polygon', coordinates: polyCoords } };
        const b = pathFn.bounds(f);
        if (b[0][0] !== Infinity) {
          const a = (b[1][0] - b[0][0]) * (b[1][1] - b[0][1]);
          if (a > bestArea) { bestArea = a; bestPoly = f; }
        }
      });
      if (bestPoly) return pathFn.centroid(bestPoly);
    }
    return pathFn.centroid(d);
  }

  labelGroup.selectAll('text.pref-label')
    .data(features)
    .enter()
    .append('text')
    .attr('class', 'pref-label')
    .attr('transform', d => {
      const c = getLabelCentroid(d);
      return `translate(${c[0]},${c[1]})`;
    })
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'middle')
    .style('font-size', w < 700 ? '5px' : '7px')
    .style('fill', '#1f2937')
    .style('font-weight', '600')
    .style('pointer-events', 'none')
    .style('font-family', "'Hiragino Kaku Gothic Pro','Yu Gothic',Meiryo,sans-serif")
    .text(d => {
      const n = d.properties.nam_ja;
      return n.replace('県','').replace('都','').replace('府','').substring(0,3);
    });

  // D3 ズーム設定
  let _lastZoomK = null;
  let _zoomRafId = null;
  const _labelBaseSize = w < 700 ? 5 : 7;

  // mapGroupをGPUレイヤに昇格
  mapGroup.style('will-change', 'transform');

  const zoomBehavior = d3.zoom()
    .scaleExtent([1, 80])
    .translateExtent([[-w * 0.3, -h * 0.3], [w * 1.3, h * 1.3]])
    .on('zoom', function(event) {
      // ① transformの適用だけは即時（パン・ピンチをなめらかに）
      currentTransform = event.transform;
      mapGroup.attr('transform', event.transform);

      // ② それ以外は次のフレームに1回だけ実行
      if (_zoomRafId) return;
      _zoomRafId = requestAnimationFrame(() => {
        _zoomRafId = null;
        const k = currentTransform.k;
        if (k !== _lastZoomK) {
          _lastZoomK = k;
          labelGroup.selectAll('text.pref-label')
            .style('font-size', (_labelBaseSize / k) + 'px');
          labelGroup.style('display', k >= 2.5 ? 'block' : 'none');
          updateZoomUI(k);
        }
      });
    });

  svg.call(zoomBehavior);

  // リセットボタン
  document.getElementById('reset-btn').onclick = () => {
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity);
  };

  applyFilter();
  updatePrefList();

  // 初期ロード時に市区町村を1回だけロード
  prefGroup.style('opacity', 0.08);
  muniGroup.style('display', 'block');
  loadMunicipalities();

  updateZoomUI(1);

  // resizeの際にzoomBehaviorを保持
  svg.__zoom_behavior = zoomBehavior;

  const elapsed = performance.now() - (_debug.startTime || 0);
  _debug.stats.prefCount = features.length;
  _debug.stats.renderTimeMs = elapsed.toFixed(1);
  _debug.log(`都道府県数: ${features.length}, 描画時間: ${elapsed.toFixed(1)}ms`);
  if (window.DEBUG) {
    console.table({
      都道府県数: features.length,
      描画時間ms: elapsed.toFixed(1),
      エラー: 'なし'
    });
  }
}

function openPopup(shortName, fullName){
  const areas = AREA_DATA[shortName] || [];
  const maxR = MAX_RATINGS[shortName] || 0;

  document.getElementById('pp-title').textContent = fullName + '　投資エリア分析';

  badge.textContent = STARS(maxR) + (RATING_LABELS[maxR] ? ' ' + RATING_LABELS[maxR].replace(/⭐+\s*/,'') : '');
  badge.className = 'max-badge mb' + maxR;
  document.getElementById('pp-maxlabel').textContent = `${areas.length}エリア収録`;

  const body = document.getElementById('pp-body');
  body.innerHTML = '';

  areas.forEach(a => {
    const r = a.rating;
    const card = document.createElement('div');
    card.className = `ac ar${r}`;

      <div class="an">

        <span class="sb sb${r}">${STARS(r)}</span>

      <div class="dr"><span class="dl">🏠 需給状況</span><span class="dv">${a.vacancy}</span></div>
      <div class="dr"><span class="dl">⚠️ 地盤・災害</span><span class="dv">${a.landRisk}</span></div>

function closePopup(){

  popup.style.display = 'none';

}

document.getElementById('pp-close').addEventListener('click', closePopup);
overlay.addEventListener('click', closePopup);

// Legend filter
document.querySelectorAll('.leg-item[data-filter]').forEach(el => {

    if(activeFilter === f){ activeFilter = null; }
    else { activeFilter = f; }

    });

function applyFilter(){
  svg.selectAll('path.pref').style('opacity', d => {
    if(activeFilter === null) return 1;
    const shortName = PREF_SHORT[d.properties.nam_ja] || d.properties.nam_ja;
    return MAX_RATINGS[shortName] === activeFilter ? 1 : 0.18;
  });
}

function updatePrefList(){
  const el = document.getElementById('pref-list');
  if (!el) return; // Safety Guard
  const groups = {};
  for(const [k,v] of Object.entries(MAX_RATINGS)){
    if(!groups[v]) groups[v] = [];
    groups[v].push(PREF_FULL[k] || k);
  }
  let html = '';
  for(let r=5; r>=1; r--){
    if(groups[r]){
      html += `<div style="color:#4b5563;font-size:.65rem;margin-top:6px">${STARS(r)}</div>`;
      html += `<div style="color:#6b7280">${groups[r].join('、')}</div>`;
    }
  }
  if (el) el.innerHTML = html;
}

// Load map (fetch area_data.json + pref.topojson in parallel, then render)
async function initMapOffline() {
  try {
    if (!mapWrap || mapWrap.clientWidth === 0 || mapWrap.clientHeight === 0) {
      setTimeout(initMapOffline, 50);
      return;
    }

    const badge = document.getElementById('loading-badge');
    if (badge) { badge.textContent = '⏳ データ読み込み中...'; badge.style.display = 'block'; }

    await Promise.all([
      _loadScript('area_data.js'),
      _loadScript('pref_topo.js')
    ]);

    AREA_DATA = window.AREA_DATA;
    initializeData();

    if (badge) badge.style.display = 'none';

    const japan = window.JAPAN_PREF_TOPOJSON;
    if (!japan || !japan.objects || !japan.objects.japan) {
      throw new Error('Prefecture TopoJSON: objects.japan が存在しません');
    }
    _debug.log('初期化開始');

    renderMap(japan);
    hideMapError(); // 以前のエラー表示があれば消す

    window.addEventListener('resize', () => {
      const oldTransform = currentTransform;
      try {
        renderMap(japan);
        if (oldTransform !== d3.zoomIdentity) {
          const zb = svg.node().__zoom_behavior;
          if (zb) svg.call(zb.transform, oldTransform);
        }
      } catch(resizeErr) {
        console.error('[resize] renderMap失敗:', resizeErr.message);
        if (window.DEBUG) console.error('[DEBUG]', resizeErr);
        showMapError('地図の再描画に失敗しました');
      }
    });

    _debug.log('初期化完了');
  } catch(err) {
    console.error('[init] 初期化失敗:', err.message);
    if (window.DEBUG) console.error('[DEBUG] エラー詳細:', err);
    showMapError('地図データの読み込みに失敗しました');
  }
}

if (document.readyState === 'complete') {
  setTimeout(initMapOffline, 50);
} else {
  window.addEventListener('load', () => setTimeout(initMapOffline, 50));
}


// ==========================================
// New UI Functions
// ==========================================

function calcScore(rating) {
  return Math.min(100, rating * 18 + 10);
}

function getRankInfo(rating) {
  const map = {
    5: { label: '最優良(S)', cls: 'rank-ss' },
    4: { label: '優良(A)', cls: 'rank-a' },
    3: { label: '条件付き適合(B)', cls: 'rank-b' },
    2: { label: '要選別(C)', cls: 'rank-c' },
    1: { label: '不適合(D)', cls: 'rank-d' }
  };
  return map[rating] || { label: 'データなし', cls: 'rank-d' };
}

function generateStrengths(area) {
  const items = [];
  const rec = (area.recommendation || '') + ' ' + (area.vacancy || '');
  if (rec.includes('安定')) items.push('安定した賃貸需要');
  if (rec.includes('実需')) items.push('実需に支えられた市場');
  if (rec.includes('利回り')) items.push('高利回り期待');
  if (rec.includes('転勤')) items.push('転勤・法人需要');
  if (rec.includes('学生') || rec.includes('大学')) items.push('学生・若者需要');
  if (items.length === 0 && area.rating >= 4) items.push('投資適合エリアとして評価済み');
  return items;
}

function generateRisks(area) {
  const items = [];
  const risk = area.landRisk || '';
  const vac = area.vacancy || '';
  if (risk.includes('積雪')) items.push('豪雪ハザード要確認');
  if (risk.includes('浸水') || risk.includes('氾濫')) items.push('水害リスク要確認');
  if (risk.includes('土砂')) items.push('土砂災害リスク');
  if (risk.includes('液状化')) items.push('液状化リスク');
  if (vac.includes('空室') || vac.includes('供給過多')) items.push('供給過多・空室リスク');
  return items;
}

function formatFeatureText(text) {
  if (!text) return '';
  
  // 「・人口動態：」「・賃貸需給：」「・地理リスク：」などの見出しを検出して、それぞれをブロックに分割する
  const items = text.split(/(?=・[^：\n]+：)/);
  
  if (items.length <= 1) {
    return `<div style="line-height:1.8">${text}</div>`;
  }
  
  return items.map(item => {
    item = item.trim();
    if (!item) return '';
    
    const match = item.match(/^・([^：\n]+)：([\s\S]*)$/);
    if (match) {
      const title = match[1];
      const body = match[2].trim();
      return `
        <div class="feature-section" style="margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
          <div class="feature-title" style="font-weight: 700; color: #f1f5f9; font-size: 0.78rem; margin-bottom: 5px; display: flex; align-items: center;">
            <span style="display: inline-block; width: 4px; height: 12px; background: #6366f1; margin-right: 6px; border-radius: 2px;"></span>

            ${body}
          </div>
        </div>
      `;
    }
    return `<div style="line-height:1.8">${item}</div>`;
  }).join('').replace(/border-bottom: 1px solid rgba\(255,255,255,0.05\); padding-bottom: 10px;\s*$/, ''); // 最後の要素の下線は消去
}

function closeCityPanel() {
  const sidebar = document.getElementById('right-sidebar');
  const content = document.getElementById('panel-content');
  if (sidebar) sidebar.classList.remove('panel-open');
  if (content) content.style.display = 'none';
  svg.selectAll('path.muni').classed('selected-muni', false);
  svg.selectAll('path.pref').classed('active', false);
  selected = null;
}

function zoomToCity(lat, lng) {
  if (!projFn || !svg.__zoom_behavior) return;
  const [sx, sy] = projFn([lng, lat]);
  const w = getW(), h = getH();
  const scale = 10;
  // モバイルは下パネル(48vh)が地図に重なるため、
  // 見える範囲の中央(上から約22%)に市区町村を配置する
  const isMobile = w < 600;
  const yCenter = isMobile ? h * 0.14 : h * 0.50;
  const tx = w / 2 - scale * sx;
  const ty = yCenter - scale * sy;
  const transform = d3.zoomIdentity.translate(tx, ty).scale(scale);
  svg.transition().duration(800).call(svg.__zoom_behavior.transform, transform);
}

// Override openPopup to use new right panel (for prefecture clicks)
function openPopup(shortName, fullName) {
  const areas = AREA_DATA[shortName] || AREA_DATA[fullName] || [];
  if (areas.length === 0) return;
  // Pick highest-rated area for display
  const best = areas.reduce((a, b) => (b.rating || 0) > (a.rating || 0) ? b : a, areas[0]);
  openCityPanel(fullName || shortName, fullName || shortName, best);
}


// Search functionality
const searchInput = document.getElementById('search-input');
const suggestionsContainer = document.getElementById('search-suggestions');

// 市区町村名でパスを探してblueハイライトを適用（ズーム後にロードされるまでリトライ）
function highlightMuniByName(cityName, retries = 12) {
  // ズームアニメーション(800ms)完了を待ってから実行
  setTimeout(function attempt() {
    const paths = muniGroup ? muniGroup.selectAll('path.muni') : null;
    if (!paths || paths.empty()) {
      if (retries > 0) setTimeout(attempt, 200);
      return;
    }
    const target = paths.filter(d => d._jaName === cityName);
    if (!target.empty()) {
      muniGroup.selectAll('path.muni').classed('selected-muni', false);
      target.classed('selected-muni', true);
    } else if (retries > 0) {
      setTimeout(attempt, 200);
    }
  }, 900); // ズームアニメーション800ms + 余裕100ms
}

searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();
  suggestionsContainer.innerHTML = '';
  if (!query || query.length < 1) {
    suggestionsContainer.style.display = 'none';
    return;
  }
  const matches = [];
  const seen = new Set();
  for (const [pref, list] of Object.entries(AREA_DATA)) {
    list.forEach(area => {
      (area.cities || []).forEach(city => {
        if (city.includes(query) || city.toLowerCase().includes(query)) {
          const k = pref + '_' + city;
          if (!seen.has(k)) {
            seen.add(k);
            matches.push({ pref, city, area });
          }
        }
      });
    });
  }
  const display = matches.slice(0, 6);
  if (!display.length) { suggestionsContainer.style.display = 'none'; return; }
  display.forEach(m => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.innerHTML = `<span class="sug-city">${m.city}</span><span class="sug-pref">${m.pref}</span><span class="sug-badge r${m.area.rating}">★${m.area.rating}</span>`;
    item.addEventListener('click', () => {
      searchInput.value = m.city;
      suggestionsContainer.style.display = 'none';

      // Zoom to city
      if (m.area.lat && m.area.lng) {
        zoomToCity(m.area.lat, m.area.lng);
      } else {
        const prefFeature = prefFeatures.find(f => {
          const nm = f.properties.nam_ja || '';
          return nm.includes(m.pref) || m.pref.includes(nm.replace(/[県都府]$/, ''));
        });
        if (prefFeature) {
          const [cx, cy] = d3.geoCentroid(prefFeature);
          zoomToCity(cy, cx);
        }
      }

      // ズームアニメーション完了後にハイライト適用（リトライあり）
      highlightMuniByName(m.city);

      openCityPanel(m.city, m.pref, m.area);
    });
    suggestionsContainer.appendChild(item);
  });
  suggestionsContainer.style.display = 'block';
});

document.addEventListener('click', (e) => {
  if (e.target !== searchInput) suggestionsContainer.style.display = 'none';
});

// Zoom in/out buttons
document.getElementById('zoom-in-btn').addEventListener('click', () => {
  if (svg.__zoom_behavior) svg.transition().duration(300).call(svg.__zoom_behavior.scaleBy, 1.5);

document.getElementById('zoom-out-btn').addEventListener('click', () => {
  if (!svg.__zoom_behavior) return;
  const k = currentTransform.k;
  if (k <= 1) return; // 100%以下にはしない
  svg.transition().duration(300).call(svg.__zoom_behavior.scaleBy, 0.67);
});
