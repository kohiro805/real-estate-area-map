<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ ハザードマップ | 不動産エリア特性マップ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0f172a;
  --bg-secondary: #1e2d45;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: rgba(255,255,255,0.08);
}
body {
  font-family: 'Hiragino Kaku Gothic Pro','Yu Gothic',Meiryo,sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#app-header {
  height: 56px;
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
#header-left { display: flex; align-items: center; gap: 12px; }
#header-logo { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
#header-sub { font-size: 0.65rem; color: var(--text-secondary); letter-spacing: 0.08em; }
#header-right { display: flex; gap: 8px; }
.tab-btn {
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.tab-btn:not(.active) { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
.tab-btn:not(.active):hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }

#map-frame {
  flex: 1;
  width: 100%;
  border: none;
  display: block;
}

/* iframeがブロックされた場合のフォールバック */
#fallback {
  display: none;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  text-align: center;
}
#fallback .msg { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }
#fallback a {
  padding: 14px 32px;
  background: #3b82f6;
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 1rem;
  transition: background 0.2s;
}
#fallback a:hover { background: #2563eb; }

@media (max-width: 768px) {
  #app-header { height: 44px; padding: 0 12px; }
  #header-logo { font-size: 0.85rem; }
  #header-sub { display: none; }
  .tab-btn { padding: 4px 10px; font-size: 0.68rem; }
}
</style>
</head>
<body>

<header id="app-header">
  <div id="header-left">
    <div id="header-logo">🗾 不動産エリア特性マップ</div>
    <div id="header-sub">HAZARD MAP</div>
  </div>
  <div id="header-right">
    <a href="index.html" class="tab-btn">🗾 エリア特性マップ</a>
    <a href="hazard.html" class="tab-btn active">⚠️ ハザードマップ</a>
  </div>
</header>

<iframe
  id="map-frame"
  src="https://disaportal.gsi.go.jp/maps/index.html"
  allowfullscreen
  loading="lazy"
  title="重ねるハザードマップ（国土交通省）">
</iframe>

<div id="fallback">
  <div class="msg">
    ブラウザのセキュリティ設定により、<br>
    ハザードマップを直接表示できません。<br>
    以下のボタンから国土交通省の公式サイトを開いてください。
  </div>
  <a href="https://disaportal.gsi.go.jp/maps/index.html" target="_blank" rel="noopener">
    ⚠️ 重ねるハザードマップを開く ↗
  </a>
</div>

<script>
// iframeの読み込みエラー時にフォールバック表示
const frame = document.getElementById('map-frame');
const fallback = document.getElementById('fallback');

frame.addEventListener('error', () => {
  frame.style.display = 'none';
  fallback.style.display = 'flex';
});

// 5秒後にiframeが空白のままならフォールバック表示
setTimeout(() => {
  try {
    const doc = frame.contentDocument || frame.contentWindow?.document;
    if (!doc || doc.body.innerHTML === '') {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    }
  } catch(e) {
    // X-Frame-Options等でアクセス不可 → フォールバック
    frame.style.display = 'none';
    fallback.style.display = 'flex';
  }
}, 5000);
</script>

</body>
</html>
